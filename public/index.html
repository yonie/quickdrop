<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)">
<title>QuickDrop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 14a4 4 0 0 1 4-4h15l6 6h27a4 4 0 0 1 4 4v32a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z' fill='%23E8A720'/%3E%3Cpath d='M4 24a4 4 0 0 1 4-4h48a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z' fill='%23FFCB45'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="window" id="win">
  <div class="titlebar" id="titlebar">
    <div class="tab"><span class="tab-icon" id="tabIcon"></span><span class="tab-title" id="tabTitle">QuickDrop</span><span class="tab-x" data-icon="close"></span></div>
    <div class="tab-plus" data-icon="plus"></div>
    <div class="spacer"></div>
    <div class="winbtns">
      <button class="wb" id="wbMin" tabindex="-1" aria-label="Minimize" data-icon="min"></button>
      <button class="wb" id="wbMax" tabindex="-1" aria-label="Maximize" data-icon="max"></button>
      <button class="wb close" id="wbClose" tabindex="-1" aria-label="Close" data-icon="close"></button>
    </div>
  </div>

  <div class="toolbar">
    <button class="tb" id="btnBack" title="Back (Alt + Left Arrow)" data-icon="back"></button>
    <button class="tb" id="btnFwd" title="Forward (Alt + Right Arrow)" data-icon="forward"></button>
    <button class="tb" id="btnUp" title="Up (Alt + Up Arrow)" data-icon="up"></button>
    <button class="tb" id="btnRefresh" title="Refresh (F5)" data-icon="refresh"></button>
    <div class="address" id="address"></div>
    <label class="search"><input id="search" type="search" placeholder="Search QuickDrop" autocomplete="off"><span data-icon="search"></span></label>
  </div>

  <div class="commandbar">
    <button class="cb" id="cmdNew" title="New folder (Ctrl + Shift + N)"><span data-icon="newfolder"></span><span class="cb-label">New folder</span></button>
    <button class="cb" id="cmdUpload" title="Upload files"><span data-icon="upload"></span><span class="cb-label">Upload</span></button>
    <button class="cb" id="cmdRestore" title="Restore to the original location" hidden><span data-icon="undo"></span><span class="cb-label">Restore all</span></button>
    <button class="cb" id="cmdEmpty" title="Empty Recycle Bin" hidden><span data-icon="delete"></span><span class="cb-label">Empty Recycle Bin</span></button>
    <div class="cb-sep" id="sepEdit"></div>
    <button class="cb icon-only" id="cmdRename" title="Rename (F2)"><span data-icon="rename"></span></button>
    <button class="cb icon-only" id="cmdDownload" title="Download (Enter)"><span data-icon="download"></span></button>
    <button class="cb icon-only" id="cmdDelete" title="Delete (Del)"><span data-icon="delete"></span></button>
    <div class="cb-sep"></div>
    <button class="cb" id="cmdArrange" title="Arrange icons by name"><span data-icon="arrange"></span><span class="cb-label">Arrange</span></button>
    <div class="spacer"></div>
    <button class="cb" id="cmdSettings" title="Settings"><span data-icon="settings"></span><span class="cb-label">Settings</span></button>
    <button class="cb icon-only" id="cmdHelp" title="Help (F1)"><span data-icon="help"></span></button>
    <input type="file" id="filePick" multiple hidden>
  </div>

  <div class="main">
    <nav class="nav" id="nav"></nav>
    <div class="content" id="content" tabindex="0">
      <div class="canvas" id="canvas"></div>
      <div class="empty-hint" id="emptyHint">Drop files here</div>
    </div>
  </div>

  <div class="statusbar">
    <span id="stCount"></span>
    <span id="stSel"></span>
    <span id="stUpload"></span>
    <span class="spacer"></span>
    <span class="quota" id="quota"><span class="quota-bar"><span id="quotaFill"></span></span><span id="quotaText"></span></span>
  </div>
</div>

<div class="menu" id="menu" hidden></div>
<div class="modal" id="modal" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
